services:
  - type: web
    name: projeto-ong-api
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    numInstances: 1
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        fromDatabase:
          name: projeto-ong-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: projeto-ong-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "2"
  - type: web
    name: projeto-ong-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
databases:
  - name: projeto-ong-db
    region: virginia
    plan: 0.1c-256mb
    databaseName: projeto_ong
    user: projeto_ong
    ipAllowList: []
